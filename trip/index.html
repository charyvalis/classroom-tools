<title>我的旅行手帳</title>

<style>
/*
VOICE: 安靜、溫和的旅行手帳，一個人出國也安心
IDEA: 隨身攜帶的手帳＋車票夾：一頁一件事，大字時間
PICTURE: 依行程時間移動的小人頭像路線圖
COLOUR and TYPE: 米紙底、橄欖綠主色、沙金點綴；Noto Serif TC 標題＋Noto Sans TC 內文
LAYOUT: 手機優先單欄卡片，底部分頁列，桌機置中 560px
*/
:root{color-scheme:light dark;
--bg:light-dark(#f3eee5,#1b1c18);--card:light-dark(#fbf9f4,#25271f);--soft:light-dark(#e9e3d6,#30322a);
--ink:light-dark(#2e2c27,#ece7dc);--mute:light-dark(#77716a,#a39d90);--line:light-dark(#ddd5c6,#3d3f35);
--olive:light-dark(#4f6041,#a9bd92);--olive2:light-dark(#dfe4d6,#33402b);--sand:light-dark(#a8935c,#d2bd86);--sand2:light-dark(#efe6cf,#3b3524);
--red:light-dark(#b0442f,#ef8a72);--map:light-dark(#ece4d4,#2a2c24);--street:light-dark(#fbf8f1,#363930);--water:light-dark(#d8e0e2,#2b3a3f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:"Noto Serif TC",serif;margin:0;line-height:1.15;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--olive);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(96px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
header.top h1{font-size:22px;flex:1}
.dot{width:12px;height:12px;border-radius:50%;background:var(--mute);flex:none}
.dot.on{background:var(--olive)}
.ibtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
.card h2{font-size:20px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ic{width:36px;height:36px;border-radius:12px;background:var(--olive2);display:grid;place-items:center;flex:none}
.ic svg{width:20px;height:20px;stroke:var(--olive);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.small{font-size:13px;color:var(--mute)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.btn{min-height:44px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:500}
.btn.pri{background:var(--olive);border-color:var(--olive);color:light-dark(#fff,#18200f)}
.btn{color:inherit}a.btn{color:var(--ink)}.btn.pri{color:light-dark(#fff,#18200f)!important}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:12px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--sand2);color:var(--sand);font-size:13px;font-weight:700;white-space:nowrap}
.pill.dark{background:var(--ink);color:var(--bg)}
input,select,textarea{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);padding:8px 12px;font-size:16px}
textarea{min-height:96px;resize:vertical}
label.f{display:block;margin-bottom:10px}label.f>span{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px}
.chk input{width:22px;height:22px;min-height:0;accent-color:var(--olive)}
/* weather */
.wx{display:grid;grid-template-columns:5.5em 40px 1fr;align-items:center;gap:10px;background:var(--bg);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.wx b{font-size:17px}.wx svg{width:36px;height:36px}
/* money */
.conv{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:end}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);white-space:nowrap}
.chip.on{background:var(--olive);color:light-dark(#fff,#18200f);border-color:var(--olive)}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}.bar>i{display:block;height:100%;background:var(--olive);border-radius:99px}
/* now card */
.now{background:var(--olive2);border-radius:18px;padding:16px;display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start}
.now .t{font-size:22px;font-weight:700}
.big{font-size:clamp(17px,4.6vw,20px);font-weight:700;background:var(--sand2);color:var(--ink);border-radius:12px;padding:8px 12px;margin-top:8px;display:inline-block}
.big.warn{color:var(--red)}
/* itinerary */
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scroll-snap-type:x mandatory}
.days .chip{scroll-snap-align:start;flex:none}
.stop{display:grid;grid-template-columns:64px 18px 1fr;gap:0 10px;position:relative}
.stop .tm{font-size:19px;font-weight:700;text-align:right;white-space:nowrap;padding-top:2px}
.stop .tm s{display:block;font-size:12px;color:var(--mute);font-weight:400}
.stop .rail{position:relative}
.stop .rail::before{content:"";position:absolute;left:8px;top:12px;bottom:-12px;width:2px;background:var(--line)}
.stop:last-child .rail::before{display:none}
.stop .nd{position:absolute;left:2px;top:8px;width:14px;height:14px;border-radius:50%;border:2.5px solid var(--mute);background:var(--card)}
.stop.past .nd{background:var(--olive);border-color:var(--olive)}
.stop.cur .nd{border-color:var(--ink);box-shadow:0 0 0 4px var(--olive2)}
.stop.fixed .nd{border-radius:3px;background:var(--sand);border-color:var(--sand)}
.stop .bd{padding-bottom:18px}
.stop .nm{font-size:17px;font-weight:700}
.stop.cur .bd{background:var(--olive2);border-radius:14px;padding:10px 12px;margin-bottom:12px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
/* map */
.fig{position:relative;border-radius:18px;overflow:hidden;background:var(--map)}
.fig>svg{display:block;width:100%;height:auto}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--olive)}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--mute);margin-top:8px}
/* ledger */
.li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.amt{font-weight:700;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tot{font-family:"Noto Serif TC",serif;font-size:clamp(28px,8vw,40px);font-weight:700;line-height:1.1}
.lrow{display:flex;align-items:center;gap:10px;min-height:48px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .x{width:36px;height:36px;border:0;background:none;color:var(--mute);font-size:20px}
.lrow.done .tx{text-decoration:line-through;color:var(--mute)}
/* emergency */
.em{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--bg);margin-bottom:8px}
.em .n{font-size:28px;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums;white-space:nowrap}
.phrase{padding:12px 0;border-bottom:1px solid var(--line)}.phrase:last-child{border-bottom:0}
.phrase .loc{font-size:20px;font-weight:700}
.show{font-size:24px;font-weight:700;line-height:1.4;background:var(--bg);border-radius:14px;padding:14px;word-break:break-word}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav.tabs button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:12px;color:var(--mute);min-height:52px;border-radius:14px;padding:4px 0}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--olive);background:var(--olive2);font-weight:700}
nav.tabs button.em-t{color:var(--red)}
@media(min-width:700px){nav.tabs{max-width:560px;margin:0 auto 12px;border:1px solid var(--line);border-radius:22px}}
/* sheet */
.mask{position:fixed;inset:0;background:rgb(0 0 0/.35);z-index:9;display:none;align-items:flex-end;justify-content:center}
.mask.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{font-size:20px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:10;opacity:0;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .w{font-size:12px;color:var(--mute);padding:4px 0}
.cal button,.cal span.e{min-height:46px;border-radius:12px;border:0;background:none;font-size:15px;display:grid;place-items:center;line-height:1.1;padding:2px}
.cal button.tr{background:var(--olive2);color:var(--ink);font-weight:700}
.cal button.tr small{font-size:10px;font-weight:500;color:var(--olive)}
.cal button.sel{background:var(--olive);color:light-dark(#fff,#18200f)}.cal button.sel small{color:inherit}
.cal button.today{outline:2px solid var(--sand)}
.calm{font-family:"Noto Serif TC",serif;font-weight:700;font-size:17px;margin:12px 0 6px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

let tab="home",selDay=null,preview=null,dbRef=null,saveTimer=null,wxCache={},mapSel=null;
const T=()=>S.trips.find(x=>x.id===S.cur)||S.trips[0];
const CO=()=>C[T().country]||C.GB;

/* ---------- 時間 ---------- */
const toMin=s=>{const[h,m]=String(s||"0:0").split(":").map(Number);return h*60+(m||0)};
const fm=m=>{m=Math.round(m);const h=Math.floor(((m%1440)+1440)%1440/60),mm=((m%60)+60)%60;return String(h).padStart(2,"0")+":"+String(mm).padStart(2,"0")};
function localNow(){const tz=CO().tz;let p;try{p=new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date())}catch(e){p=new Intl.DateTimeFormat("en-CA",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date())}
  const g=k=>p.find(x=>x.type===k).value;const date=`${g("year")}-${g("month")}-${g("day")}`;
  const di=Math.round((Date.UTC(...date.split("-").map((v,i)=>i==1?v-1:+v))-Date.UTC(...T().start.split("-").map((v,i)=>i==1?v-1:+v)))/864e5);
  return{date,min:(+g("hour"))*60+(+g("minute")),di}}
function dayDate(i){const[y,m,d]=T().start.split("-").map(Number);const x=new Date(Date.UTC(y,m-1,d+i));return`${x.getUTCMonth()+1}/${x.getUTCDate()}（${"日一二三四五六"[x.getUTCDay()]}）`}
function calc(day){const s=[...day.stops].sort((a,b)=>toMin(a.t)-toMin(b.t)).map(x=>({...x,eff:toMin(x.t)+(x.fixed?0:(x.delay||0))}));
  s.forEach((x,i)=>{const nx=s[i+1];x.dep=nx?nx.eff-(x.travel||0):null;x.latest=nx?(nx.fixed?x.dep:x.dep+(+T().grace||0)):null;x.clash=nx&&nx.fixed&&!x.fixed&&x.eff+5>x.dep});return s}
function where(s,m){let i=-1;s.forEach((x,k)=>{if(x.eff<=m)i=k});if(i<0)return{i:-1,move:0};const x=s[i];
  if(x.dep!=null&&m>=x.dep&&s[i+1]){const p=Math.min(1,(m-x.dep)/Math.max(1,x.travel||1));return{i,move:p}}return{i,move:0}}

function nowBlock(){const t=T(),n=localNow();let di=n.di,m=n.min,label="";

  const day=t.days[di];if(!day||!day.stops.length)return"";const s=calc(day),w=where(s,m);
  const cur=s[Math.max(0,w.i)],nx=s[Math.max(0,w.i)+1];
  let left="";if(w.i>=0&&cur.latest!=null&&!label){const r=cur.latest-m;left=r>=0?`<span class="big">最晚 ${fm(cur.latest)} 出發・剩餘 ${r} 分鐘</span>`:`<span class="big warn">已超過最晚出發 ${-r} 分鐘</span>`}

  ${w.move>0?`<div class="small">正在前往下一站（約 ${Math.round(w.move*100)}%）</div>`:cur.dep!=null?`<div class="small">預計 ${fm(cur.dep)} 出發</div>`:'<div class="small">今天最後一站</div>'}${left}</div></div>`}
  ${nx?`<div class="row" style="margin-top:12px"><span class="small">下一站</span><b>${fm(nx.eff)} ${esc(nx.n)}</b>${nx.fixed?'<span class="pill">固定班次</span>':""}<span class="sp"></span><a class="btn sm pri" style="display:inline-flex;align-items:center;text-decoration:none" href="${navUrl(nx)}" target="_blank" rel="noopener">導航</a></div>`:""}

function navUrl(x){const t=T();return"https://www.google.com/maps/dir/?api=1&destination="+(x.lat!=null&&x.lat!==""?`${x.lat},${x.lng}`:encodeURIComponent(x.n+" "+(t.cities[0]?.[0]||"")))+"&travelmode=transit"}

  <button class="btn sm" data-a="tab" data-v="lists" style="margin-top:6px">看全部清單</button></div>`}
function quick(c){const r=+T().rate||1;const base=[300,1000,3000,10000].map(tw=>tw/r);return base.map(v=>{const p=Math.pow(10,Math.max(0,Math.floor(Math.log10(v))));return Math.round(v/p)*p})}

/* ---------- 日曆 ---------- */
function calCard(){const t=T(),n=localNow();const[y,m,d]=t.start.split("-").map(Number);const s0=Date.UTC(y,m-1,d),N=t.days.length;
  const months=[];for(let i=0;i<N;i++){const x=new Date(s0+i*864e5);const k=x.getUTCFullYear()*12+x.getUTCMonth();if(!months.includes(k))months.push(k)}
  const tw=new Date(Date.now()+8*36e5).toISOString().slice(0,10);
  const grid=months.map(k=>{const Y=Math.floor(k/12),M=k%12;const first=new Date(Date.UTC(Y,M,1)).getUTCDay(),dim=new Date(Date.UTC(Y,M+1,0)).getUTCDate();let c="";
    for(let i=0;i<first;i++)c+='<span class="e"></span>';
    for(let dd=1;dd<=dim;dd++){const di=Math.round((Date.UTC(Y,M,dd)-s0)/864e5);const iso=`${Y}-${String(M+1).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;const inT=di>=0&&di<N;
      c+=inT?`<button class="tr ${di===selDay?"sel":""} ${iso===tw?"today":""}" data-a="day" data-v="${di}">${dd}<small>Day ${di+1}</small></button>`:`<button class="${iso===tw?"today":""}" data-a="pickStart" data-v="${iso}" aria-label="${M+1}月${dd}日">${dd}</button>`}
    return`<div class="calm">${Y} 年 ${M+1} 月</div><div class="cal">${"日一二三四五六".split("").map(w=>`<span class="w">${w}</span>`).join("")}${c}</div>`}).join("");
  return`<div class="card"><h2>${ico("cal")}旅行日曆</h2>
  <div class="g2"><label class="f"><span>出發日（第一天）</span><input type="date" id="calStart" value="${esc(t.start)}"></label><label class="f"><span>一共幾天</span><select id="calDays">${Array.from({length:30},(_,i)=>`<option ${i+1===N?"selected":""}>${i+1}</option>`).join("")}</select></label></div>
  ${grid}<p class="small" style="margin:8px 0 0">點綠色的日子看那天行程；改出發日，整趟行程會一起搬過去。</p></div>`}
/* ---------- 頁面：行程 ---------- */
function plan(){const t=T(),n=localNow();if(selDay==null)selDay=Math.min(Math.max(n.di,0),t.days.length-1);
  const day=t.days[selDay];const s=day?calc(day):[];const live=n.di===selDay;const w=live?where(s,n.min):{i:-2};
  const shifted=day&&day.stops.some(x=>x.delay);
  return calCard()+`<div class="days">${t.days.map((d,i)=>`<button class="chip ${i===selDay?"on":""}" data-a="day" data-v="${i}">Day ${i+1}・${dayDate(i)}</button>`).join("")}<button class="chip" data-a="addDay">＋ 加一天</button></div>
  ${day?`<div class="card"><h2>Day ${selDay+1}・${esc(day.title||"")}<span class="sp"></span><button class="btn sm" data-a="editDay">改標題</button></h2>
  <div class="row" style="margin:-4px 0 14px"><span class="small">${dayDate(selDay)}</span><span class="sp"></span><button class="btn sm pri" data-a="editStop" data-id="">＋ 新增一站</button></div>
  ${shifted?`<div class="row" style="margin:-4px 0 12px"><span class="small">有行程往後延了，固定班次不會跟著動。</span><button class="btn sm" data-a="undoDelay">回到原訂時間</button></div>`:""}
  ${s.map((x,i)=>`<div class="stop ${live&&i<w.i?"past":""} ${live&&i===w.i?"cur":""} ${x.fixed?"fixed":""}">
   <div class="tm">${fm(x.eff)}${x.delay&&!x.fixed?`<s>原 ${esc(x.t)}</s>`:""}</div><div class="rail"><span class="nd"></span></div>
   <div class="bd"><div class="row"><span class="nm">${esc(x.n)}</span>${x.delay&&!x.fixed?`<span class="pill">+${x.delay}</span>`:""}${x.fixed?`<span class="pill">${shifted?"不順延":"固定班次"}</span>`:""}</div>
   ${x.dep!=null?`<div class="small">預計 ${fm(x.dep)} 出發・路上約 ${x.travel} 分</div>`:""}${x.clash?`<div class="small" style="color:var(--red)">小心：可能趕不上下一個固定班次</div>`:""}
   ${x.note?`<div class="small">${esc(x.note)}</div>`:""}
   <div class="acts">${x.fixed?"":`<button class="btn sm" data-a="delay" data-id="${x.id}" data-v="15">延 15 分</button><button class="btn sm" data-a="delay" data-id="${x.id}" data-v="30">延 30 分</button>`}<a class="btn sm" style="display:inline-flex;align-items:center;text-decoration:none" href="${navUrl(x)}" target="_blank" rel="noopener">導航</a><button class="btn sm" data-a="editStop" data-id="${x.id}">編輯</button></div></div></div>`).join("")||'<p class="small">這天還沒有行程。</p>'}
  <button class="btn pri" data-a="editStop" data-id="" style="width:100%;margin-top:4px">＋ 新增行程</button>
  <p class="small">按「延 15／30 分」：這一站和後面的行程一起往後推；固定班次（方形點）維持原時間。</p></div>
  <div class="card"><h2>${ico("book")}旅程日記</h2><textarea id="diary" placeholder="今天去了哪裡、吃了什麼、有什麼想記住的…">${esc(day.diary||"")}</textarea></div>`:""}`}

/* ---------- 頁面：地圖 ---------- */
function avatarSVG(sz){return`<svg width="${sz}" height="${sz*1.2}" viewBox="0 0 50 60" aria-hidden="true"><path d="M25 58C25 58 4 36 4 22a21 21 0 0 1 42 0c0 14-21 36-21 36z" fill="var(--card)" stroke="var(--ink)" stroke-width="2.5"/><circle cx="25" cy="22" r="15" fill="var(--olive2)"/><path d="M13 32a12 8 0 0 1 24 0z" fill="var(--olive)" opacity=".55"/><circle cx="25" cy="20" r="7" fill="#f4dcc4" stroke="var(--ink)" stroke-width="1.3"/><path d="M18 19c0-6 14-6 14 0-3-2-10-2-14 0z" fill="#3a3129"/><circle cx="22.5" cy="20.5" r=".9" fill="#3a3129"/><circle cx="27.5" cy="20.5" r=".9" fill="#3a3129"/><path d="M22.8 23.3q2.2 1.6 4.4 0" stroke="#3a3129" stroke-width="1" fill="none"/></svg>`}
function mapPage(){const t=T(),n=localNow();if(selDay==null)selDay=Math.min(Math.max(n.di,0),t.days.length-1);const day=t.days[selDay];if(!day||!day.stops.length)return`<div class="card"><p>這天還沒有行程，先到「行程」新增。</p></div>`;
  const s=calc(day);const lo=s[0].eff-30,hi=s[s.length-1].eff+90;if(preview==null||preview.d!==selDay)preview={d:selDay,m:n.di===selDay?n.min:s[0].eff};
  const m=Math.min(hi,Math.max(lo,preview.m));const w=where(s,m);
  return`<div class="days">${t.days.map((d,i)=>`<button class="chip ${i===selDay?"on":""}" data-a="day" data-v="${i}">Day ${i+1}</button>`).join("")}</div>
  <div class="card" style="padding:12px"><div class="fig" id="fig"></div>

  <input type="range" id="slider" min="${lo}" max="${hi}" step="5" value="${m}" aria-label="預覽時間">
  <div class="legend"><span>● 已過時段</span><span>◎ 目前預計</span><span>○ 尚未開始</span><span>■ 固定班次</span></div></div>
  <div class="card"><h2>行程時間</h2>${s.map((x,i)=>`<div class="lrow" style="${i===w.i?"background:var(--olive2);border-radius:12px;padding:0 10px":""}"><b style="width:3.4em;white-space:nowrap">${fm(x.eff)}</b><span class="tx sp">${esc(x.n)}</span><a class="small" href="${navUrl(x)}" target="_blank" rel="noopener">導航</a></div>`).join("")}
  <p class="small">頭像依照預定的行程時間推算位置，不是 GPS 即時定位。</p></div>`}
function drawMap(){const f=$("#fig");if(!f)return;const t=T(),day=t.days[selDay],s=calc(day);const W=Math.max(300,f.clientWidth),H=Math.round(W*.78);
  const hasXY=s.filter(x=>x.lat!==""&&x.lat!=null&&!isNaN(+x.lat)).length>=2&&new Set(s.map(x=>x.lat+","+x.lng)).size>1;
  let pts;const pad=48;
  if(hasXY){const ok=s.map(x=>x.lat!==""&&x.lat!=null&&!isNaN(+x.lat));const la=s.filter((x,i)=>ok[i]).map(x=>+x.lat),ln=s.filter((x,i)=>ok[i]).map(x=>+x.lng);
    const k=Math.cos((Math.min(...la)+Math.max(...la))/2*Math.PI/180);const x0=Math.min(...ln)*k,x1=Math.max(...ln)*k,y0=Math.min(...la),y1=Math.max(...la);
    const sc=Math.min((W-pad*2)/Math.max(1e-6,x1-x0),(H-pad*2-20)/Math.max(1e-6,y1-y0));const ox=(W-(x1-x0)*sc)/2,oy=(H-(y1-y0)*sc)/2+10;
    let last=[W/2,H/2];pts=s.map((x,i)=>{if(!ok[i])return last=[last[0]+20,last[1]];return last=[ox+(+x.lng*k-x0)*sc,oy+(y1-+x.lat)*sc]})}
  else pts=s.map((x,i)=>{const p=s.length>1?i/(s.length-1):.5;return[pad+p*(W-pad*2),H/2+Math.sin(p*Math.PI*2)*H*.22]});
  const m=Math.min(+$("#slider")?.value||0,1e9),w=where(s,m);
  let ax,ay;if(w.i<0){[ax,ay]=pts[0]}else if(w.move>0){const a=pts[w.i],b=pts[w.i+1];ax=a[0]+(b[0]-a[0])*w.move;ay=a[1]+(b[1]-a[1])*w.move}else[ax,ay]=pts[w.i];
  let r=7;const g=[];for(let i=0;i<9;i++){r=(r*9301+49297)%233280;g.push(r/233280)}
  const streets=g.map((v,i)=>i%2?`<path d="M${v*W} -10 L${v*W+(g[(i+3)%9]-.5)*W*.3} ${H+10}" stroke="var(--street)" stroke-width="${8+i%3*4}" fill="none"/>`:`<path d="M-10 ${v*H} L${W+10} ${v*H+(g[(i+4)%9]-.5)*H*.3}" stroke="var(--street)" stroke-width="${8+i%3*4}" fill="none"/>`).join("");
  const seg=(a,b,past)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${past?"var(--olive)":"var(--mute)"}" stroke-width="${past?5:3}" stroke-linecap="round" ${past?"":'stroke-dasharray="2 9"'}/>`;
  let lines="";for(let i=0;i<pts.length-1;i++){if(i<w.i)lines+=seg(pts[i],pts[i+1],1);else if(i===w.i&&w.move>0){lines+=seg(pts[i],[ax,ay],1)+seg([ax,ay],pts[i+1],0)}else lines+=seg(pts[i],pts[i+1],0)}
  const small=W<420;
  const nodes=pts.map((p,i)=>{const x=s[i],past=i<w.i||(i===w.i&&w.move>0),cur=i===w.i&&!w.move;const up=i%2===0;const lx=Math.min(W-6,Math.max(6,p[0]));const anchor=p[0]<70?"start":p[0]>W-70?"end":"middle";
    const nm=small&&x.n.length>7?x.n.slice(0,7)+"…":x.n;
    const node=x.fixed?`<rect x="${p[0]-7}" y="${p[1]-7}" width="14" height="14" rx="3" fill="var(--sand)"/>`:`<circle cx="${p[0]}" cy="${p[1]}" r="${cur?9:7}" fill="${past?"var(--olive)":"var(--card)"}" stroke="${past?"var(--olive)":cur?"var(--ink)":"var(--mute)"}" stroke-width="3"/>`;
    return node+`<text x="${lx}" y="${p[1]+(up?-16:26)}" text-anchor="${anchor}" font-size="${small?11:13}" fill="var(--ink)" font-weight="700" paint-order="stroke" stroke="var(--map)" stroke-width="4">${fm(x.eff)} ${esc(nm)}</text>`}).join("");
  f.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="當天路線圖"><rect width="${W}" height="${H}" fill="var(--map)"/>${streets}<path d="M${W*.55} ${H+5} Q ${W*.8} ${H*.82} ${W+5} ${H*.7} L${W+5} ${H+5}z" fill="var(--water)"/>${lines}${nodes}
  <g transform="translate(${ax-22} ${ay-56})">${avatarSVG(44).replace(/^<svg[^>]*>|<\/svg>$/g,"").replace(/^/,'<g transform="scale(.88)">')+"</g>"}</g>
  <g transform="translate(${Math.min(W-130,Math.max(4,ax-63))} ${Math.max(4,ay-92)})"><rect width="126" height="28" rx="14" fill="var(--card)" stroke="var(--ink)" stroke-width="1.5"/><text x="63" y="19" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">${fm(m)} 預計在這裡</text></g></svg>`}

function ledger(){const t=T(),c=CO();const L=t.ledger;const total=L.reduce((a,x)=>a+toTW(x.amt,x.cur),0);
  const bal={};t.members.forEach(p=>bal[p]=0);L.forEach(x=>{const v=toTW(x.amt,x.cur);const sp=(x.split||[]).filter(p=>p in bal);if(!sp.length)return;bal[x.payer]=(bal[x.payer]||0)+v;sp.forEach(p=>bal[p]-=v/sp.length)});
  const cr=Object.entries(bal).filter(e=>e[1]>0.5).map(e=>[...e]),db=Object.entries(bal).filter(e=>e[1]<-0.5).map(e=>[e[0],-e[1]]);const settle=[];
  while(cr.length&&db.length){const a=db[0],b=cr[0],v=Math.min(a[1],b[1]);settle.push(`${esc(a[0])} 給 ${esc(b[0])} NT$ ${nf(v)}`);a[1]-=v;b[1]-=v;if(a[1]<.5)db.shift();if(b[1]<.5)cr.shift()}

document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v,id=b.dataset.id,t=T();
  if(a==="tick")return;

  if(a==="delDay"){t.days.splice(selDay,1);selDay=Math.max(0,selDay-1);save();close();return render()}
  if(a==="delay"){const s=calc(t.days[selDay]);const k=s.findIndex(x=>x.id===id);s.slice(k).forEach(x=>{if(!x.fixed){const o=t.days[selDay].stops.find(y=>y.id===x.id);o.delay=(o.delay||0)+ +v}});save();toast(`後面的行程往後推 ${v} 分鐘`);return render()}
  if(a==="undoDelay"){t.days[selDay].stops.forEach(x=>x.delay=0);save();return render()}
  if(a==="editStop")return editStop(id);
  if(a==="saveStop"){const day=t.days[selDay];let x=day.stops.find(s=>s.id===id);if(!x){x={id:uid(),delay:0};day.stops.push(x)}
    x.t=$("#eT").value||"09:00";x.n=$("#eN").value.trim()||"未命名";x.travel=+$("#eTr").value||0;x.fixed=$("#eF").checked;x.note=$("#eNote").value.trim();const ll=parseLL($("#eLL").value);x.lat=ll?ll[0]:"";x.lng=ll?ll[1]:"";save();close();return render()}
  if(a==="delStop"){const day=t.days[selDay];day.stops=day.stops.filter(s=>s.id!==id);save();close();return render()}
  if(a==="nowMap"){preview=null;return render()}
  if(a==="fx"){$("#fx1").value=v;conv(1);return}
  if(a==="editExp")return editExp(id);
  if(a==="saveExp"){let x=t.ledger.find(z=>z.id===id);if(!x){x={id:uid()};t.ledger.push(x)}const amt=parseFloat($("#xA").value);if(!(amt>0)){toast("請輸入金額");return}
    x.item=$("#xI").value.trim()||"未命名";x.amt=amt;x.cur=$("#xC").value;x.cat=$("#xK").value;x.day=+$("#xD").value;x.payer=$("#xP")?.value||t.members[0];x.split=$("#xP")?[...document.querySelectorAll(".xS:checked")].map(i=>i.value):[...t.members];save();close();return render()}
  if(a==="delExp"){t.ledger=t.ledger.filter(z=>z.id!==id);save();close();return render()}
  if(a==="del"){t[b.dataset.l]=t[b.dataset.l].filter(z=>z.id!==id);save();return render()}
  if(a==="sug"){t.pack.push({id:uid(),t:v,d:false});save();return render()}
  if(a==="addCt"){t.contacts.push(["",""]);save();return render()}
  if(a==="copy"){try{await navigator.clipboard.writeText(t.hotel);toast("已複製")}catch(err){toast("請長按文字自己複製")}return}
  if(a==="close")return close();
  if(a==="addCity"){const ta=$("#sCities");ta.value=(ta.value.trim()?ta.value.trim()+"\n":"")+v;return}
  if(a==="saveSet"){t.name=$("#sName").value.trim()||"我的旅行";const nc=$("#sCountry").value;if(nc!==t.country){t.country=nc;t.rate=C[nc].rate;t.rateDate="";t.rateAuto=true;t.taxOn=false}
    t.start=$("#sStart").value||t.start;t.grace=+$("#sGrace").value||0;t.hotel=$("#sHotel").value.trim();
    t.members=$("#sMem").value.split(/[、,，\s]+/).map(s=>s.trim()).filter(Boolean);if(!t.members.length)t.members=["我"];
    const known=Object.values(C).flatMap(c=>c.cities);t.cities=$("#sCities").value.split("\n").map(l=>l.split(/[,，]/).map(s=>s.trim())).filter(p=>p[0]).map(p=>{if(p.length>=3&&!isNaN(+p[1]))return[p[0],+p[1],+p[2]];const k=known.find(c=>c[0]===p[0]);return k?[...k]:[p[0],null,null]});
    wxCache={};save();close();render();loadWx();loadRate();return}
  if(a==="newTrip"){const n={...sample(),id:uid(),name:"新的旅程",country:$("#sCountry").value};const c=C[n.country];Object.assign(n,{rate:c.rate,rateDate:"",cities:c.cities.slice(0,2).map(x=>[...x]),days:[{title:"Day 1",stops:[],diary:""}],todo:[{id:uid(),t:"護照效期還有 6 個月以上",d:false},{id:uid(),t:"買旅遊不便險",d:false}],pack:["護照","信用卡","轉接頭","網卡／eSIM"].map(t=>({id:uid(),t,d:false})),shop:[],ledger:[],members:["我"],hotel:"",contacts:[["旅遊保險緊急電話",""],["信用卡掛失",""]]});
    S.trips.push(n);S.cur=n.id;selDay=0;wxCache={};save();close();render();loadWx();loadRate();settings();return}
  if(a==="delTrip"){if(S.trips.length<2){toast("至少要留一個旅程");return}if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="再按一次確定刪除";return}S.trips=S.trips.filter(x=>x.id!==t.id);S.cur=S.trips[0].id;selDay=null;wxCache={};save();close();render();loadWx();return}
  if(a==="backup"){try{await navigator.clipboard.writeText(JSON.stringify(S));toast("備份已複製，貼到記事本存好")}catch(err){$("#bk").value=JSON.stringify(S);toast("請長按下方文字全選複製")}return}
  if(a==="restore"){try{const o=JSON.parse($("#bk").value);if(!o.trips)throw 0;S=o;selDay=null;wxCache={};save();close();render();loadWx();toast("已還原")}catch(err){toast("備份內容看不懂，請再貼一次")}return}
});
$("#setBtn").addEventListener("click",settings);
$("#mask").addEventListener("click",e=>{if(e.target.id==="mask")close()});
document.addEventListener("change",e=>{const el=e.target,t=T();
  if(el.dataset.a==="tick"){const x=t[el.dataset.l].find(z=>z.id===el.dataset.id);if(x){x.d=el.checked;save();setTimeout(render,250)}}
  if(el.id==="calStart"&&el.value){t.start=el.value;save();render();return}
  if(el.id==="calDays"){const n=+el.value;if(n>t.days.length){while(t.days.length<n)t.days.push({title:"",stops:[],diary:""})}else if(n<t.days.length){const extra=t.days.slice(n);if(extra.some(d=>d.stops.length||d.diary)&&el.dataset.sure!=="1"){el.dataset.sure="1";el.value=t.days.length;toast("後面幾天還有行程，再選一次才會刪掉");return}t.days.length=n;if(selDay>=n)selDay=n-1}save();render();return}
  if(el.id==="rateAuto"){t.rateAuto=el.checked;save();if(el.checked)loadRate(true)}
  if(el.id==="taxOn"){t.taxOn=el.checked;save();conv(1)}
  if(el.id==="sTrip"){S.cur=el.value;selDay=null;wxCache={};save();close();render();loadWx();loadRate()}
  if(el.id==="sCountry"){const c=C[el.value];$("#cityChips").innerHTML=c.cities.map(x=>`<button class="chip" data-a="addCity" data-v="${esc(x.join(", "))}">＋ ${esc(x[0])}</button>`).join("")}
  if(el.dataset.ct!=null){t.contacts[+el.dataset.ct][+el.dataset.k]=el.value;save()}});
function conv(dir){const t=T(),c=CO(),r=+t.rate||0,a=$("#fx1"),b=$("#fx2");if(!a)return;const tax=c.tax&&t.taxOn?1+c.tax/100:1;
  if(dir===1){const v=parseFloat(a.value);b.value=isNaN(v)?"":nf(v*tax*r)}else{const v=parseFloat(String(b.value).replace(/,/g,""));a.value=isNaN(v)?"":nf(v/r/tax,2).replace(/,/g,"")}}
document.addEventListener("input",e=>{const el=e.target,t=T();
  if(el.id==="fx1")conv(1);if(el.id==="fx2")conv(2);
  if(el.id==="rate"){const v=parseFloat(el.value);if(v>0){t.rate=v;t.rateAuto=false;$("#rateAuto").checked=false;save();conv(1)}}
  if(el.id==="diary"){t.days[selDay].diary=el.value;save()}
  if(el.id==="slider"){preview={d:selDay,m:+el.value};const lab=el.parentElement.querySelector(".row b");if(lab)lab.textContent=fm(+el.value);const sm=el.parentElement.querySelector(".row .small");if(sm)sm.textContent="拖動預覽時間";drawMap()}});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target,k=f.dataset.f,t=T();const v=f.t.value.trim();if(!v)return;const o={id:uid(),t:v,d:false};if(f.p)o.p=parseFloat(f.p.value)||0;t[k].push(o);save();render();const nf2=document.querySelector(`form[data-f="${k}"] input`);if(nf2)nf2.focus()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});

/* ---------- 天氣、匯率（放到自己的網址時會自動抓） ---------- */
async function loadWx(){const t=T();for(const ct of t.cities){if(ct[1]==null){wxCache[ct[0]]={err:1};continue}
  try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${ct[1]}&longitude=${ct[2]}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1`);const j=await r.json();
    wxCache[ct[0]]={now:j.current.temperature_2m,code:j.current.weather_code,hi:j.daily.temperature_2m_max[0],lo:j.daily.temperature_2m_min[0]}}catch(err){wxCache[ct[0]]={err:1}}}
  if(tab==="home")render()}
async function loadRate(force){const t=T(),c=CO();if(!t.rateAuto)return;const today=new Date().toISOString().slice(0,10);if(!force&&t.rateStamp===today)return;
  try{const r=await fetch("https://open.er-api.com/v6/latest/"+c.cur);const j=await r.json();const v=j.rates&&j.rates.TWD;if(v){t.rate=+v.toFixed(v<1?4:2);t.rateStamp=today;const d=new Date();t.rateDate=`${d.getMonth()+1}/${d.getDate()}`;save();if(tab==="home")render()}}catch(err){}}

/* ---------- 跨裝置同步 ---------- */
async function initDb(){try{if(!window.claude||!window.claude.use)return;const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);if(!db||!user)return;
  const id=await user.id();if(!id)return;dbRef=db.collection("data/users/"+id).doc("tripbook");
  const r=await dbRef.get();let v=r;if(v&&typeof v.data==="function")v=v.data();else if(v&&v.data&&v.data.payload)v=v.data;
  if(v&&v.payload&&(+v.t||0)>(S.t||0)){const o=JSON.parse(v.payload);if(o&&o.trips){S=o;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}selDay=null;render();loadWx()}}
  else if(S.t)await dbRef.set({payload:JSON.stringify(S),t:S.t});
  $("#sync").classList.add("on");$("#sync").title="已同步到你的帳號"}catch(err){$("#sync").title="只存在這台裝置"}}

render();loadWx();loadRate();initDb();
(async()=>{try{if(!window.claude||!window.claude.use)return;const d=await window.claude.use("desktop");if(!d||!d.install)return;if(await d.install.state()==="available"){const b=$("#inst");b.hidden=false;b.addEventListener("click",async()=>{try{await d.install.request();b.hidden=true}catch(e){toast("這裡沒辦法安裝，請用 Claude 電腦版開啟")}})}}catch(e){}})();
setInterval(()=>{if((tab==="home"||tab==="plan")&&!$("#mask").classList.contains("open")&&!document.activeElement.matches("input,textarea,select"))render()},60000);
}
</script>
